format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$python\
$character"""

[directory]
style = "white"

[character]
success_symbol = "[●](bold gray) "
error_symbol = "[●](bold red) "
vimcmd_symbol = "[❮](green)"

[git_branch]
format =  '[$branch(:$remote_branch)]($style) '
style = "bright-white"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "gray"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "blue"
